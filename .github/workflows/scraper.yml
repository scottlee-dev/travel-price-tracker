name: Cancun Price Tracker Pipeline

on:
  schedule:
    - cron: '0 13 * * *'   # run once per day at 13:00 UTC
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 Preview
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Playwright & Dependencies
        run: |
          dotnet build --configuration Release
          dotnet tool install --global Microsoft.Playwright.CLI
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          EMAIL_SENDER_EMAIL: ${{ secrets.EMAIL_SENDER_EMAIL }}
          EMAIL_SENDER_PASSWORD: ${{ secrets.EMAIL_SENDER_PASSWORD }}
          EMAIL_SENDER_NAME: ${{ secrets.EMAIL_SENDER_NAME }}
          EMAIL_RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT_EMAIL }}
          EmailSettings__SenderEmail: ${{ secrets.EMAIL_SENDER_EMAIL }}
          EmailSettings__SenderPassword: ${{ secrets.EMAIL_SENDER_PASSWORD }}
          EmailSettings__SenderName: ${{ secrets.EMAIL_SENDER_NAME }}
          EmailSettings__RecipientEmail: ${{ secrets.EMAIL_RECIPIENT_EMAIL }}

          TARGET_THRESHOLD: "970.00"
          CHECK_IN: "2027-03-22"
          CHECK_OUT: "2027-03-26"
          SEARCH_ROOM: "Ocean Front Suite Double (2 Queen)"
          SEARCH_RATE: "I Prefer Member Rate"
        run: dotnet run --configuration Release

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add price_history.csv price_trend.png README.md || true
          
          if ! git diff --cached --quiet; then
            git commit -m "Chore: Update price history and trend chart [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi